# Render blueprint: the JobNavigator backend plus its database.
#
# Render reads this from the repository root. Point a Blueprint at the repo and it
# creates both services; everything else is set once in the dashboard.
#
# Set to the free plans. Know what that costs before relying on it:
#
#   * 512 MB RAM. PDF export renders through headless Chromium, which is the one thing
#     in this image likely to exceed that — expect résumé download to be the first
#     feature to fail, while import and tailoring (plain HTTP calls) are fine.
#   * The instance spins down after 15 minutes without traffic. APScheduler stops with
#     it, so scheduled scraping and the digest silently never run. Anything you trigger
#     yourself still works, after a cold start of a minute or so on a 2 GB image.
#   * Render deletes free databases after their trial window. Move to a paid database,
#     or pg_dump anything you want to keep.
#
# `starter` for the web service and `basic-256mb` for the database are the smallest
# paid tiers that remove all three problems.
services:
  - type: web
    name: jobnavigator-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /api/resumes/templates
    envVars:
      # Render injects the connection string from the database below.
      - key: DATABASE_URL
        fromDatabase:
          name: jobnavigator-db
          property: connectionString
      # The dashboard password, used on the very first boot to seed the API key.
      # Generated once by Render; read it from the dashboard and give the same value
      # to the Streamlit app as API_KEY. Without it the API is open to anyone.
      - key: INITIAL_API_KEY
        generateValue: true
      # Playwright's browsers are installed into the image at build time.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /root/.cache/ms-playwright

databases:
  - name: jobnavigator-db
    databaseName: jobnavigator
    user: jobnavigator
    plan: free
